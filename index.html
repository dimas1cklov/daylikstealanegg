<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steal an Egg — Daily Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1a3a}
body{display:flex;justify-content:center;font-family:'Fredoka',system-ui,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
.app{position:relative;width:100%;max-width:430px;min-height:100vh;min-height:100dvh;overflow:hidden;background:#5ec8ff}

/* blurred background */
.bg{position:absolute;inset:-40px;filter:blur(9px);transform:scale(1.05)}
.bg div{position:absolute}
.shade{position:absolute;inset:0;background:rgba(10,8,40,.45)}
.egg{border-radius:50% 50% 46% 46%/60% 60% 40% 40%}

.content{position:relative;min-height:100vh;min-height:100dvh;padding:40px 14px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.content.hide{visibility:hidden}

.stroke{paint-order:stroke fill;-webkit-text-stroke:5px #1a1033}
.stroke-sm{paint-order:stroke fill;-webkit-text-stroke:3.5px #1a1033}
.lilita{font-family:'Lilita One',sans-serif}

.title-wrap{display:flex;flex-direction:column;align-items:center;transform:rotate(-2deg)}
.title{margin:0;padding:0;border:0;background:transparent;cursor:pointer;font-family:'Lilita One',sans-serif;font-size:min(50px,12.5vw);white-space:nowrap;line-height:1;letter-spacing:1px;color:#ffe14d;text-shadow:0 5px 0 #1a1033}
.ribbon{margin-top:8px;padding:6px 22px;border-radius:14px;background:#ff4fa3;border:4px solid #1a1033;box-shadow:0 5px 0 #1a1033;font-size:24px;line-height:1;color:#fff}

.panel{width:100%;margin-top:8px;padding:16px 14px 18px;border-radius:28px;background:#2b5cff;border:5px solid #1a1033;box-shadow:0 8px 0 #1a1033,inset 0 -8px 0 #1f43c4,inset 0 4px 0 #5e86ff;display:flex;flex-direction:column;gap:12px;animation:popIn .45s ease-out both}
.panel-head{display:flex;align-items:center;justify-content:space-between}
.panel-head .h{font-size:26px;color:#fff}
.progress{padding:4px 12px;border-radius:999px;background:#1a1033;font-weight:700;font-size:15px;color:#ffe14d}

.card{position:relative;display:flex;align-items:center;gap:12px;padding:10px;border-radius:22px;background:#fff;border:4px solid #1a1033;box-shadow:0 5px 0 #1a1033;color:#1a1033}
.tile{position:relative;flex:0 0 auto;width:104px;height:104px;border-radius:18px;border:3px solid #1a1033;display:flex;align-items:center;justify-content:center}
.tile img{position:relative;width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(26,16,51,.6))}
.info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.name{font-size:22px;line-height:1.05}
.rarity{align-self:flex-start;padding:3px 10px;border-radius:9px;border:2px solid #1a1033;font-weight:700;font-size:13px;letter-spacing:.5px;color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:4px}
.stat{padding:2px 8px;border-radius:8px;background:#eef2ff;font-weight:700;font-size:13.5px;color:#2b3a8f}

.btn{cursor:pointer;transition:transform .12s ease,filter .12s ease;font-family:'Lilita One',sans-serif;color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px)}
.btn:focus-visible,.title:focus-visible{outline:3px solid #fff;outline-offset:3px}
.claim{flex:0 0 auto;position:relative;overflow:hidden;min-width:84px;height:52px;padding:0 10px;border-radius:15px;border:3px solid #1a1033;background:#3ddc4f;box-shadow:0 4px 0 #1a1033,inset 0 -5px 0 #26a836;font-size:19px}
.done{flex:0 0 auto;min-width:84px;height:52px;border-radius:15px;border:3px solid #1a1033;background:#d6dbe8;display:flex;align-items:center;justify-content:center;gap:4px;font-family:'Lilita One',sans-serif;font-size:16px;color:#4a5370;animation:popIn .3s ease-out both}
.go{position:relative;overflow:hidden;margin-top:6px;height:60px;display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:18px;border:4px solid #1a1033;background:#ffc928;box-shadow:0 6px 0 #1a1033,inset 0 -7px 0 #e59a00;font-size:26px;animation:popIn .45s ease-out both}
.hint{text-align:center;font-weight:600;font-size:14px;color:#dfe7ff}
.shine{position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.4s ease-in-out infinite;pointer-events:none}
.rel{position:relative}

.icon-float{animation:floaty 2.6s ease-in-out infinite}
.pop-img{animation:bounce .6s ease-out both}

/* effects */
.ring{position:absolute;left:50%;top:50%;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;border:6px solid #ffe14d;animation:ringOut .7s ease-out both;pointer-events:none}
.ring2{border-color:#fff;animation-delay:.12s}
.flash{position:absolute;inset:-4px;border-radius:22px;background:#fff6a8;animation:flashA .5s ease-out both;pointer-events:none}
.plus{position:absolute;left:50%;top:6px;white-space:nowrap;font-family:'Lilita One',sans-serif;font-size:22px;color:#3ddc4f;animation:plusUp 1.1s ease-out both;pointer-events:none;z-index:2}
.pt{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:#ffe14d;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:burst .8s ease-out both;pointer-events:none}
.pt.big{width:26px;height:26px;margin:-13px 0 0 -13px;animation-duration:1.1s}
.p1{--dx:0px;--dy:-80px}.p2{--dx:58px;--dy:-58px;background:#fff}.p3{--dx:80px;--dy:0px;background:#ff4fa3}.p4{--dx:58px;--dy:58px}
.p5{--dx:0px;--dy:80px;background:#43e0ff}.p6{--dx:-58px;--dy:58px;background:#fff}.p7{--dx:-80px;--dy:0px;background:#3ddc4f}.p8{--dx:-58px;--dy:-58px;background:#ff4fa3}
.pt.big.p1{--dy:-150px}.pt.big.p2{--dx:110px;--dy:-110px}.pt.big.p3{--dx:150px}.pt.big.p4{--dx:110px;--dy:110px}.pt.big.p5{--dy:150px}.pt.big.p6{--dx:-110px;--dy:110px}.pt.big.p7{--dx:-150px}.pt.big.p8{--dx:-110px;--dy:-110px}

.popup{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,6,40,.55);animation:fadeOut 1.6s ease-in both;z-index:10}
.popup .stage{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
.popup .stage img{position:relative;width:200px;height:200px;object-fit:contain;animation:bigPop .6s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 6px 0 rgba(26,16,51,.6))}
.rays{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:repeating-conic-gradient(rgba(255,225,77,.55) 0 12deg,transparent 12deg 30deg);animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.glow{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;filter:blur(30px);opacity:.85}
.pop-title{font-size:40px;line-height:1;color:#ffe14d;text-shadow:0 4px 0 #1a1033;animation:bigPop .5s .1s cubic-bezier(.2,1.6,.4,1) both}
.pop-name{font-size:26px;color:#fff;animation:bigPop .5s .18s cubic-bezier(.2,1.6,.4,1) both}
.pop-rarity{padding:4px 14px;border-radius:10px;border:3px solid #1a1033;font-weight:700;font-size:15px;letter-spacing:.5px;color:#fff;animation:bigPop .5s .24s cubic-bezier(.2,1.6,.4,1) both}

@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringOut{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.2);opacity:0}}
@keyframes flashA{0%{opacity:.9}100%{opacity:0}}
@keyframes plusUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.1);opacity:1}100%{transform:translate(-50%,-56px) scale(1);opacity:0}}
@keyframes burst{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(180deg);opacity:0}}
@keyframes bounce{0%{transform:scale(1)}25%{transform:scale(1.35) rotate(-6deg)}50%{transform:scale(.92) rotate(4deg)}75%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes bigPop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadeOut{0%,78%{opacity:1}100%{opacity:0}}

@media (max-width:360px){
  .title{font-size:42px}
  .tile{width:88px;height:88px}.tile img{width:78px;height:78px}
  .name{font-size:19px}
  .claim,.done{min-width:74px}
}
</style>
</head>

  <div id="popup-root"></div>
</div>

};
const rg = (a, b) => `radial-gradient(circle at 50% 40%, ${a}, ${b})`;
const REWARDS = [
  { name: 'Galaxy Trail',      rarity: 'COSMIC',  stats: ['5× Speed'],                 img: IMG.galaxy,       tile: rg('#6a3dff', '#1d0b55') },
  { name: 'Moonbloom Trail',   rarity: 'DIVINE',  stats: ['20× Speed', '5Q $'],        img: IMG.moonbloom,    tile: rg('#c9fff4', '#23b5a6') },
  { name: 'Divine Trail',      rarity: 'DIVINE',  stats: ['14× Speed', '300T $'],      img: IMG.divinetrail,  tile: rg('#fff3c2', '#f2b632') },
  { name: 'Eternal Trail',     rarity: 'ETERNAL', stats: ['10× Speed', '12,5T $'],     img: IMG.eternaltrail, tile: rg('#ffd1ec', '#ff3fa4') },
  { name: 'Angelic Treadmill', rarity: 'DIVINE',  stats: ['+2k Speed/Step', '1Qa $'],  img: IMG.angelic,      tile: rg('#fff3c2', '#f2b632') },
  { name: 'Astral Treadmill',  rarity: 'TITAN',   stats: ['+3k Speed/Step', '15Qa $'], img: IMG.astral,       tile: rg('#6fd8ff', '#123a7a') },
  { name: 'Demonic Treadmill', rarity: 'ETERNAL', stats: ['+1k Speed/Step', '50T $'],  img: IMG.demonic,      tile: rg('#ff9a4a', '#6b0f0f') },
  { name: 'Hacker Treadmill',  rarity: 'SECRET',  stats: ['+500 Speed/Step', '2T $'],  img: IMG.hacker,       tile: rg('#2a6b3a', '#050d07') },
  { name: 'Luminous Egg',      rarity: 'DIVINE',  stats: [],                           img: IMG.luminous,     tile: rg('#bff4ff', '#3a8dff') },
  { name: 'World Burner',      rarity: 'DIVINE',  stats: [],                           img: IMG.worldburner,  tile: rg('#ff7a7a', '#3a0a10') },
  { name: 'Archangel',         rarity: 'DIVINE',  stats: [],                           img: IMG.archangel,    tile: rg('#ffffff', '#f2c94c') },
  { name: 'Pegasus',           rarity: 'ETERNAL', stats: [],                           img: IMG.pegasus,      tile: rg('#fff7d6', '#ff9fd6') },
  { name: 'Nightmare',         rarity: 'DIVINE',  stats: [],                           img: IMG.nightmare,    tile: rg('#b8f58a', '#2f6b1f') },
  { name: 'Aetheron',          rarity: 'DIVINE',  stats: [],                           img: IMG.aetheron,     tile: rg('#ffe9a8', '#8a1a1a') }
];

// ====== LOGIC ======
let combo = [];
let claimed = [false, false, false];
let popTimer = null;

function pickCombo(prev) {
  let c;
  do {
    const idx = REWARDS.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    c = idx.slice(0, 3);
  } while (prev.length && c.some(v => prev.includes(v)));
  return c;
}

const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const particles = (big) => [1,2,3,4,5,6,7,8].map(n => `<span class="pt ${big ? 'big ' : ''}p${n}" aria-hidden="true"></span>`).join('');
const CHECK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2fae3f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';

function cardHTML(r, i, fx) {
  return `
  <div class="card" data-i="${i}">
    <div class="tile" style="background:${r.tile}">
      ${fx ? '<span class="ring" aria-hidden="true"></span><span class="ring ring2" aria-hidden="true"></span>' : ''}
      <img class="${fx ? 'pop-img' : 'icon-float'}" src="${r.img}" alt="${esc(r.name)}">
      ${fx ? particles(false) : ''}
    </div>
    <div class="info">
      <div class="name lilita">${esc(r.name)}</div>
      <div class="rarity" style="background:${RARITY[r.rarity]}">${r.rarity}</div>
      <div class="stats">${r.stats.map(s => `<div class="stat">${esc(s)}</div>`).join('')}</div>
    </div>
    ${claimed[i]
      ? `<div class="done">${CHECK}DONE</div>`
      : `<button class="btn claim" data-claim="${i}" aria-label="Claim ${esc(r.name)}"><span class="shine"></span><span class="stroke-sm rel">CLAIM</span></button>`}
    ${fx ? `<span class="flash" aria-hidden="true"></span><span class="plus stroke-sm" aria-hidden="true">+1 ${esc(r.name)}</span>` : ''}
  </div>`;
}

function render(fxIndex = -1) {
  const items = combo.map(i => REWARDS[i]);
  document.getElementById('cards').innerHTML = items.map((r, i) => cardHTML(r, i, i === fxIndex)).join('');
  const count = claimed.filter(Boolean).length;
  document.getElementById('progress').textContent = count + '/3';
  document.getElementById('footer').innerHTML = count === 3
    ? `<a class="btn go" href="${ACCOUNT_URL}" target="_blank" rel="noopener"><span class="shine"></span><span class="stroke rel">GO TO ACCOUNT</span></a>`
    : `<div class="hint">Claim all 3 rewards to continue</div>`;
}

function showPopup(r) {
  const root = document.getElementById('popup-root');
  clearTimeout(popTimer);
  root.innerHTML = `
    <div class="popup" aria-live="polite">
      <div class="stage">
        <span class="rays" aria-hidden="true"></span>
        <span class="glow" aria-hidden="true" style="background:${RARITY[r.rarity]}"></span>
        <img src="${r.img}" alt="">
        ${particles(true)}
      </div>
      <div class="pop-title lilita stroke">CLAIMED!</div>
      <div class="pop-name lilita stroke-sm">${esc(r.name)}</div>
      <div class="pop-rarity" style="background:${RARITY[r.rarity]}">${r.rarity}</div>
    </div>`;
  popTimer = setTimeout(() => { root.innerHTML = ''; }, 1600);
}

document.getElementById('cards').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-claim]');
  if (!btn) return;
  const i = Number(btn.dataset.claim);
  if (claimed[i]) return;
  claimed[i] = true;
  render(i);
  showPopup(REWARDS[combo[i]]);
});

document.getElementById('title').addEventListener('click', () => {
  location.reload();
});

let prev = [];
try { prev = JSON.parse(sessionStorage.getItem('sae_prev') || '[]'); } catch (e) {}
combo = pickCombo(Array.isArray(prev) ? prev : []);
try { sessionStorage.setItem('sae_prev', JSON.stringify(combo)); } catch (e) {}
render();
</script>
</body>
</html>
